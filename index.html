<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#252525">
<!-- Stranica je već tamna: browser je ne sme sam zatamnjivati/invertovati u dark modu -->
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Siux M caffe – digitalni meni</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Kapakana:wght@400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#252525; --gold:#C5A653; --cream:#E3D9C5; --cream-2:#EDE4D3;
    --muted:rgba(227,217,197,0.66); --line:rgba(227,217,197,0.12);
    color-scheme: dark;
  }
  html,body{background:#252525}
  img{color-scheme:dark}
  @media (prefers-color-scheme: dark){ html,body{background:#252525;color:#E3D9C5} }
  @media (prefers-color-scheme: light){ html,body{background:#252525;color:#E3D9C5} }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  p,h1,h2,h3,ul{margin:0}

  header{padding:36px 20px 8px;display:flex;flex-direction:column;align-items:center}
  header img{width:132px;height:auto;display:block}
  .script{font-family:'Kapakana',cursive;font-size:34px;line-height:1;color:var(--cream);margin-top:4px;letter-spacing:.5px}

  nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid rgba(227,217,197,0.14)}
  .pills{max-width:560px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:14px 20px;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{flex:none;min-height:44px;padding:0 18px;border-radius:999px;font:600 14px 'Manrope',system-ui,sans-serif;white-space:nowrap;cursor:pointer;background:transparent;color:var(--cream);border:1px solid rgba(227,217,197,0.37);transition:background .15s,color .15s}
  .pill[aria-pressed="true"]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
  .pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  main{max-width:560px;margin:0 auto;padding:24px 20px 64px;display:flex;flex-direction:column;gap:44px}

  /* Akcija */
  .promo{position:relative;border:1px solid var(--gold);border-radius:22px;padding:30px 22px 26px;background:rgba(197,166,83,0.08);display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .promo::before{content:"";position:absolute;inset:6px;border:1px solid rgba(197,166,83,0.32);border-radius:17px;pointer-events:none}
  .promo-head{display:flex;flex-direction:column;align-items:center;gap:6px}
  .promo-title{display:flex;align-items:center;gap:12px}
  .dia{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex:none}
  .bar{width:34px;height:1px;background:var(--gold)}
  .promo h2{font-family:'DM Serif Display',serif;font-weight:400;font-size:32px;line-height:1;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}
  .promo-sub{font-size:11px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;color:rgba(227,217,197,0.7)}
  .combo{display:flex;align-items:center;justify-content:center;gap:16px;width:100%}
  .combo-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
  .combo-item .n{font-family:'DM Serif Display',serif;font-size:24px;line-height:1.1;color:var(--cream-2)}
  .combo-item .s{font-size:12px;color:var(--muted)}
  .plus{flex:none;width:38px;height:38px;border-radius:999px;background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;line-height:1}
  .dash{width:100%;border-top:1px dashed rgba(197,166,83,0.4)}
  .promo-price{font-family:'DM Serif Display',serif;font-size:46px;line-height:1;color:var(--gold)}
  .promo-price span{font-family:'Manrope',sans-serif;font-size:16px;font-weight:600}

  /* Sekcije */
  section.cat{display:flex;flex-direction:column;gap:28px}
  .cat-head{display:flex;align-items:center;gap:14px}
  .cat-head .ln{flex:1;height:1px;background:rgba(197,166,83,0.45)}
  .cat-head h2{font-family:'DM Serif Display',serif;font-weight:400;font-size:25px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);text-align:center}
  .group{display:flex;flex-direction:column;gap:4px}
  .group h3{margin-bottom:6px;font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  .row{padding:11px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
  .row-main{display:flex;align-items:baseline;gap:10px}
  .row .n{font-size:16px;font-weight:500;color:var(--cream-2);line-height:1.3}
  .row .s{font-size:12px;color:var(--muted);white-space:nowrap}
  .row .dots{flex:1;min-width:16px;border-bottom:1px dotted rgba(227,217,197,0.3);transform:translateY(-4px)}
  .row .p{white-space:nowrap;color:var(--gold);font-weight:600;font-size:16px}
  .row .p span{font-size:11px;font-weight:500}
  .row .d{font-size:13px;line-height:1.5;color:var(--muted)}
  .premium{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px}
  .premium li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .premium .dia{width:6px;height:6px}
  .premium span:last-child{font-size:15px;font-weight:500;line-height:1.3;color:var(--cream-2)}

  footer{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px}
  footer .ln{width:40px;height:1px;background:rgba(197,166,83,0.6)}
  footer .script{font-size:28px;color:var(--gold);margin:0}
  footer small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<header>
  <img id="logo" src="logo.png" alt="Siux M caffe">
  <p class="script">digital menu</p>
</header>

<nav aria-label="Kategorije">
  <div class="pills" id="pills"></div>
</nav>

<main>
  <section class="promo" id="promo" aria-label="Akcija">
    <div class="promo-head">
      <div class="promo-title">
        <span class="dia" aria-hidden="true"></span><span class="bar" aria-hidden="true"></span>
        <h2>Akcija</h2>
        <span class="bar" aria-hidden="true"></span><span class="dia" aria-hidden="true"></span>
      </div>
      <p class="promo-sub">Kombinacija po specijalnoj ceni</p>
    </div>
    <div class="combo">
      <div class="combo-item"><p class="n">Cedevita</p><p class="s">0,25</p></div>
      <span class="plus" aria-hidden="true"><span>+</span></span>
      <div class="combo-item"><p class="n">Espresso</p><p class="s">kafa</p></div>
    </div>
    <span class="dash" aria-hidden="true"></span>
    <p class="promo-price">305 <span>RSD</span></p>
  </section>

  <div id="menu" style="display:flex;flex-direction:column;gap:44px"></div>

  <footer>
    <span class="ln" aria-hidden="true"></span>
    <p class="script">Siux M caffe</p>
    <small>Sve cene su izražene u dinarima (RSD).</small>
  </footer>
</main>

<script>
/* ===== MENI — ovde menjaš artikle i cene =====
   I('Naziv', 'veličina', 'cena', 'opis')  — prazno '' ako nema */
function I(n, s, p, d) { return { n: n, s: s || '', p: p || '', d: d || '' }; }

var MENU = [
  { id: 'topli', title: 'Topli & hladni napici', groups: [
    { title: 'Kafe & topli napici', items: [
      I('Domaća kafa', '', '150'), I('Domaća kafa sa mlekom', '', '160'), I('Espresso', '', '170'),
      I('Cappuccino', '', '180'), I('Macchiato', '', '170'), I('Nescafe', '', '220'),
      I('Nescafe sa ukusom cookie', '', '310'), I('Nescafe sa ukusom lešnika', '', '310'),
      I('Caffe latte', '', '260'), I('Irish coffee', '', '390'),
      I('Topla čokolada crna', '', '200'), I('Topla čokolada bela', '', '200'), I('Fogato caffe', '', '290') ] },
    { title: 'Hladni napici', items: [
      I('Ice coffee', '', '340'),
      I('Frape', '', '270', 'jagoda, čokolada, lešnik, plazma, vanila, straćatela, šumsko voće, višnja-jogurt') ] },
    { title: 'Čajevi', items: [
      I('Milford', '', '140', 'menta, kamilica, hibiskus, jagoda-jogurt, 6 vrsta voća, zeleni, jabuka-cimet, šumsko voće, narandža-rum') ] },
    { title: 'Dodaci', items: [
      I('Šlag', '', '40'), I('Plazma', '', '40'), I('Med', '', '30'),
      I('France cookie', '0,03', '90'), I('France lešnik', '0,03', '90'), I('France mohito', '0,03', '90'),
      I('France mango', '0,03', '90'), I('France lubenica', '0,03', '90'), I('Kornet slatki', '', '50') ] }
  ] },
  { id: 'dezerti', title: 'Dezerti', groups: [
    { title: 'Sladoled', items: [
      I('Frikom', '50 g', '', 'jagoda, čokolada, lešnik, straćatela, vanila, šumsko voće, jogurt, višnja, plazma, malaga') ] },
    { title: 'Premium sladoled', items: [], premium: ['Badem slana karamela', 'Čokolada malina', 'Orah med', 'Triple obsession', 'Unicorn rocket', 'Kokos'] }
  ] },
  { id: 'alko', title: 'Alkoholna pića', groups: [
    { title: 'Cider', items: [ I('Somersby mango', '0,33', '360'), I('Somersby borovnica', '0,33', '360') ] },
    { title: 'Žestoka pića', items: [
      I('Jim Beam', '0,03', '320'), I('Atlantik vodka', '0,03', '140'), I('Smirnoff vodka', '0,33', '220'),
      I('Gin', '0,03', '130'), I('Megdan kajsija', '0,03', '180'), I('Megdan šljiva', '0,03', '180'),
      I('Loza', '0,03', '140'), I('Rubin vinjak', '0,03', '140'), I('Stomaklija', '0,03', '140'),
      I('Gorki list', '0,03', '170'), I('Prepečenica', '', '130'), I('Viljamovka', '', '180'),
      I('Dunja', '', '180'), I('Vermut', '0,1', '150'), I('Mastika', '', '160'), I('Campari', '', '220'),
      I('Bacardi', '', '230', 'beli rum'), I('Bacardi negra', '', '230'), I('Bacardi oro', '', '230'),
      I('Tequila', '', '220'), I('Jack Daniels', '', '360'), I('Jagermeister', '', '270'),
      I('Jameson', '', '280'), I('Chivas', '', '400'), I('Ballantines', '', '280'), I('Baileys', '', '300'),
      I('Zlatni pelin', '', '130'), I('Antique liker', '', '230'), I('Lincura', '', '130'),
      I('Finlandia vodka', '', '150'), I('Finlandia mango', '', '180'), I('Finlandia ribizla', '', '180') ] },
    { title: 'Vino', items: [ I('Vranac', '0,187', '310'), I('Graševina', '0,187', '310'), I('Sangria', '0,187', '390') ] },
    { title: 'Točeno pivo', items: [ I('Amstel', '0,33', '240'), I('Amstel', '0,5', '280') ] },
    { title: 'Flaširano pivo', items: [
      I('Heineken', '0,4', '240'), I('Heineken', '0,25', '320'), I('Heineken silver', '0,25', '320'),
      I('Zaječarsko svetlo', '0,33', '240'), I('Zaječarsko tamno', '0,33', '240'), I('Laško', '0,33', '260'),
      I('Birra Moretti', '0,33', '260'), I('Birra Moretti', '0,4', '320') ] }
  ] },
  { id: 'bezalko', title: 'Bezalkoholna pića', groups: [
    { title: 'Negazirani sokovi', items: [
      I('Next', '0,2', '260', 'breskva, jabuka, jagoda, šumsko voće, narandža') ] },
    { title: 'Cedevita 0,25', items: [
      I('Narandža', '', '180'), I('Limun', '', '180'), I('Zova-limun', '', '180'), I('Limeta', '', '180'), I('Ananas-mango', '', '180') ] },
    { title: 'Gazirani sokovi', items: [
      I('Cocta', '0,275', '260'), I('Cocta free', '0,275', '260'), I('Coca-Cola', '0,25', '260'),
      I('Coca-Cola zero', '0,25', '260'), I('Schweppes bitter', '0,25', '260'), I('Schweppes tonic', '0,25', '260'),
      I('Fanta', '0,25', '260'), I('Sprite', '0,25', '260') ] },
    { title: 'Vode', items: [
      I('Knjaz Miloš', '0,25', '160'), I('Knjaz limun', '0,33', '190'),
      I('Knjaz remix', '0,33', '210', 'narandža, breskva, limunada'),
      I('Rosa negazirana', '0,33', '170'), I('Rosa gazirana', '0,33', '170') ] },
    { title: 'Energetski napici', items: [ I('Red Bull', '0,25', '380'), I('Ultra Energy', '0,25', '240'), I('Guarana', '0,25', '240') ] },
    { title: 'Sveže ceđeni sokovi', items: [
      I('Ceđena narandža', '0,2', '360'), I('Limunada', '', '260'),
      I('Limunada sa ukusom', '0,03', '350', 'mojito, mango, lubenica') ] }
  ] }
];

var FILTERS = [['sve', 'Sve'], ['topli', 'Topli & hladni napici'], ['dezerti', 'Dezerti'], ['alko', 'Alkoholna pića'], ['bezalko', 'Bezalkoholna pića']];

/* ===== prikaz ===== */
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function buildMenu() {
  var root = document.getElementById('menu');
  MENU.forEach(function (cat) {
    var sec = el('section', 'cat');
    sec.dataset.cat = cat.id;
    var head = el('div', 'cat-head');
    head.appendChild(el('span', 'ln')).setAttribute('aria-hidden', 'true');
    head.appendChild(el('h2', null, cat.title));
    head.appendChild(el('span', 'ln')).setAttribute('aria-hidden', 'true');
    sec.appendChild(head);

    cat.groups.forEach(function (g) {
      var grp = el('div', 'group');
      grp.appendChild(el('h3', null, g.title));
      g.items.forEach(function (it) {
        var row = el('div', 'row');
        var main = el('div', 'row-main');
        main.appendChild(el('p', 'n', it.n));
        if (it.s) main.appendChild(el('span', 's', it.s));
        main.appendChild(el('span', 'dots')).setAttribute('aria-hidden', 'true');
        if (it.p) {
          var p = el('p', 'p', it.p + ' ');
          p.appendChild(el('span', null, 'RSD'));
          main.appendChild(p);
        }
        row.appendChild(main);
        if (it.d) row.appendChild(el('p', 'd', it.d));
        grp.appendChild(row);
      });
      if (g.premium && g.premium.length) {
        var ul = el('ul', 'premium');
        g.premium.forEach(function (name) {
          var li = el('li');
          li.appendChild(el('span', 'dia')).setAttribute('aria-hidden', 'true');
          li.appendChild(el('span', null, name));
          ul.appendChild(li);
        });
        grp.appendChild(ul);
      }
      sec.appendChild(grp);
    });
    root.appendChild(sec);
  });
}

function buildFilters() {
  var bar = document.getElementById('pills');
  FILTERS.forEach(function (f) {
    var b = el('button', 'pill');
    b.appendChild(el('span', null, f[1]));
    b.type = 'button';
    b.dataset.id = f[0];
    b.setAttribute('aria-pressed', f[0] === 'sve' ? 'true' : 'false');
    b.addEventListener('click', function () { select(f[0]); });
    bar.appendChild(b);
  });
}

function select(id) {
  document.querySelectorAll('.pill').forEach(function (b) {
    b.setAttribute('aria-pressed', b.dataset.id === id ? 'true' : 'false');
  });
  document.querySelectorAll('section.cat').forEach(function (s) {
    s.hidden = !(id === 'sve' || s.dataset.cat === id);
  });
  document.getElementById('promo').hidden = id !== 'sve';
  var nav = document.querySelector('nav');
  if (window.scrollY > nav.offsetTop) window.scrollTo({ top: nav.offsetTop, behavior: 'smooth' });
}

buildFilters();
buildMenu();

/* Logo se crta na canvas: Samsung Internet u dark modu zatamnjuje slike, ali canvas ne dira */
(function () {
  var img = document.getElementById('logo');
  function draw() {
    try {
      var w = img.clientWidth || 132, h = Math.round(w * img.naturalHeight / img.naturalWidth);
      var dpr = window.devicePixelRatio || 1;
      var c = document.createElement('canvas');
      c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
      c.style.width = w + 'px'; c.style.height = h + 'px'; c.style.display = 'block';
      c.setAttribute('role', 'img'); c.setAttribute('aria-label', img.alt);
      var ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, c.width, c.height);
      img.replaceWith(c);
    } catch (e) { /* ako ne uspe, ostaje obična slika */ }
  }
  if (img.complete && img.naturalWidth) draw(); else img.addEventListener('load', draw);
})();
</script>
</body>
</html>
